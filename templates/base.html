<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TechDen{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────────────────── -->
<header class="site-header">
  <nav class="nav-container">
    <a href="{{ url_for('public.index') }}" class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">TECH<strong>DEN</strong></span>
    </a>
    <div class="nav-right">
      <a href="{{ url_for('public.index') }}" class="nav-link">Shop</a>
      {% if session.get('admin_logged_in') %}
        <a href="{{ url_for('admin.dashboard') }}" class="nav-link">Admin Panel</a>
        <a href="{{ url_for('auth.admin_logout') }}" class="nav-link nav-logout">Logout</a>
      {% else %}
        <a href="{{ url_for('auth.admin_login') }}" class="nav-link nav-admin">Admin</a>
      {% endif %}
    </div>
  </nav>
</header>

<!-- ── MAIN ─────────────────────────────────────────────────────────── -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ── FOOTER ───────────────────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="footer-inner">
    <span class="logo-text footer-logo">TECH<strong>DEN</strong></span>
    <p>Premium computer accessories &amp; gadgets. All rights reserved © 2024.</p>
  </div>
</footer>

{% block extra_js %}{% endblock %}

<script>
  // ── Intersection Observer — scroll reveal ──────────────────────────
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('[data-animate], .product-grid .product-card')
    .forEach(el => revealObserver.observe(el));

  // ── Ripple effect on buttons ───────────────────────────────────────
  document.addEventListener('click', e => {
    const btn = e.target.closest('.btn-primary, .btn-search, .btn-edit, .btn-delete');
    if (!btn) return;
    const r    = document.createElement('span');
    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;` +
                      `left:${e.clientX - rect.left - size / 2}px;` +
                      `top:${e.clientY - rect.top  - size / 2}px`;
    btn.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  });

  // ── Shimmer stops once image loads ────────────────────────────────
  document.querySelectorAll('.card-image').forEach(img => {
    if (img.complete) {
      img.closest('.card-image-wrap')?.style.setProperty('animation', 'none');
    } else {
      img.addEventListener('load', () => {
        img.closest('.card-image-wrap')?.style.setProperty('animation', 'none');
      });
    }
  });
</script>
</body>
</html>
