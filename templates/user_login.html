{% extends "base.html" %}
{% block title %}Login — TechDen{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" data-animate>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Log in to your TechDen account</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label class="field-label" for="email">Email Address *</label>
        <input type="email" id="email" name="email" class="field-input"
               placeholder="you@example.com" required autofocus />
      </div>

      <div class="form-group">
        <label class="field-label" for="password">Password *</label>
        <input type="password" id="password" name="password" class="field-input"
               placeholder="Enter your password" required />
      </div>

      <button type="submit" class="btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="{{ url_for('user.register') }}" class="auth-link">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
