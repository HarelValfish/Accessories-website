{% extends "base.html" %}
{% block title %}Create Account — TechDen{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" data-animate>
    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-subtitle">Join TechDen to start shopping for accessories</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label class="field-label" for="email">Email Address *</label>
        <input type="email" id="email" name="email" class="field-input"
               placeholder="you@example.com" required autofocus />
      </div>

      <div class="form-group">
        <label class="field-label" for="password">Password *</label>
        <input type="password" id="password" name="password" class="field-input"
               placeholder="At least 6 characters" required />
      </div>

      <div class="form-group">
        <label class="field-label" for="confirm_password">Confirm Password *</label>
        <input type="password" id="confirm_password" name="confirm_password" class="field-input"
               placeholder="Re-enter your password" required />
      </div>

      <button type="submit" class="btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="{{ url_for('user.login') }}" class="auth-link">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
